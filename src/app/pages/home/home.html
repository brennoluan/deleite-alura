<img src="assets/images/banner.jpg" alt="Banner" class="banner" />

@if (showCartAlert()) {
  <div class="cart-alert">
    <p>
      <strong>Você tem {{ cartItens() }} itens no carrinho.</strong>
    </p>
    <p>Valor total estimado: R$ {{ totalValueCart() | currency: 'BRL' : 'symbol' : '1.2-2' }}</p>
    <button class="btn-empty-cart" (click)="clearCart()">Esvaziar carrinho</button>
  </div>
}

@for (category of categories; track category.id) {
  <app-product-category
    [categoryTitle]="category.title"
    [products]="category.products"
    (addProduct)="addProduct()"
  ></app-product-category>
}
